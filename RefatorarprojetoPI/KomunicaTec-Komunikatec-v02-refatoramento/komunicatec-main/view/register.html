<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="reset.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <title>KomunikaTec - Cadastro</title>
</head>

<body>
    <header>
        <nav class="nav-bar">
            <figure class="imagem-icon">
                <img src="imagens/logo1.png" alt="Logo KomunikaTec" class="img-logo">
            </figure>
            <div class="botao-navegacao">
                <button class="botao" onclick="location.href='index.php'">Home</button>
                <button class="botao-entrar" onclick="location.href='login.php'">Entrar</button>
                <button class="botao-especial" onclick="location.href='register.html'">Cadastrar</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="fundo-login">
            <div class="caixa-acesso">
                <article>
                    <figure>
                        <img class="divisao-imagem" src="imagens/foto do login-cortada.png" alt="Imagem decorativa de login">
                    </figure>
                    <section class="login-size">
                        <h2 class="titulo-login exibir-central">Cadastrar</h2>

                        <p class="span-login exibir-central">
                            <a href="#" id="adminLink" class="active">admin ou comunicador </a> &ensp; | &ensp;
                            <a href="#" id="alunoLink" class="inactive"> aluno ou ex-aluno</a>
                        </p>

                        <form action="../controller/controlar_usuario.php?acao=cadastrar" method="post">
                            <input type="hidden" id="perfil" name="perfil" value="comunicador">

                            <div id="formFields">
                                <label for="nome" class="oculto-visual">Nome</label>
                                <input id="nome" name="nome" class="inputs-login exibir-central" type="text" placeholder="Nome" required><br>

                                <label for="sobrenome" class="oculto-visual">Sobrenome</label>
                                <input id="sobrenome" name="sobrenome" class="inputs-login exibir-central" type="text" placeholder="Sobrenome" required><br>

                                <label for="email" class="oculto-visual">E-mail</label>
                                <input id="email" name="email" class="inputs-login exibir-central" type="email" placeholder="E-mail" required><br>

                                <label for="cpf" class="oculto-visual">CPF</label>
                                <input id="cpf" name="cpf" class="inputs-login exibir-central" type="text" placeholder="CPF" required><br>

                                <label for="senha" class="oculto-visual">Senha</label>
                                <input id="senha" name="senha" class="inputs-login exibir-central" type="password" placeholder="senha" required><br>
                            </div>

                            <p class="cadastro-link">
                                Já tem conta? <a href="login.php">Entrar</a>
                            </p>

                            <label class="checkbox-container">
                                <input type="checkbox" name="aceite_termo" required>
                                <span class="custom-checkbox"></span>
                                <span>Eu li e aceito a Política de Privacidade</span>
                            </label>

                            <button class="botao-enviar" type="submit">Cadastrar</button>
                        </form>
                    </section>

                </article>
            </div>
        </section>
    </main>

    <footer>

    </footer>

    <script>
        const adminLink = document.getElementById("adminLink");
        const alunoLink = document.getElementById("alunoLink");
        const formFields = document.getElementById("formFields");
        const perfilInput = document.getElementById("perfil");

        adminLink.addEventListener("click", (e) => {
            e.preventDefault();
            perfilInput.value = "comunicador";
            formFields.innerHTML = `
                <label for="nome" class="oculto-visual">Nome</label>
                <input id="nome" name="nome" class="inputs-login exibir-central" type="text" placeholder="Nome" required><br>
                <label for="sobrenome" class="oculto-visual">Sobrenome</label>
                <input id="sobrenome" name="sobrenome" class="inputs-login exibir-central" type="text" placeholder="Sobrenome" required><br>
                <label for="email" class="oculto-visual">E-mail</label>
                <input id="email" name="email" class="inputs-login exibir-central" type="email" placeholder="E-mail" required><br>
                <label for="cpf" class="oculto-visual">CPF</label>
                <input id="cpf" name="cpf" class="inputs-login exibir-central" type="text" placeholder="CPF" required><br>
                <label for="senha" class="oculto-visual">Senha</label>
                <input id="senha" name="senha" class="inputs-login exibir-central" type="password" placeholder="senha" required><br>
            `;
            adminLink.classList.add("active");
            adminLink.classList.remove("texto-secundario");
            alunoLink.classList.remove("active");
            alunoLink.classList.add("texto-secundario");
        });

        alunoLink.addEventListener("click", (e) => {
            e.preventDefault();
            perfilInput.value = "discente_egresso";
            formFields.innerHTML = `
                <label for="nome" class="oculto-visual">Nome</label>
                <input id="nome" name="nome" class="inputs-login exibir-central" type="text" placeholder="Nome" required><br>
                <label for="sobrenome" class="oculto-visual">Sobrenome</label>
                <input id="sobrenome" name="sobrenome" class="inputs-login exibir-central" type="text" placeholder="Sobrenome" required><br>
                <label for="email" class="oculto-visual">E-mail</label>
                <input id="email" name="email" class="inputs-login exibir-central" type="email" placeholder="E-mail" required><br>
                <label for="ra" class="oculto-visual">RA</label>
                <input id="ra" name="ra" class="inputs-login exibir-central" type="text" placeholder="RA (registro acadêmico)" required><br>
                <label for="senhaAluno" class="oculto-visual">Senha</label>
                <input id="senhaAluno" name="senha" class="inputs-login exibir-central" type="password" placeholder="senha" required><br>
            `;
            alunoLink.classList.add("active");
            alunoLink.classList.remove("texto-secundario");
            adminLink.classList.remove("active");
            adminLink.classList.add("texto-secundario");
        });

    </script>
</body>

</html>
